
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brew Haven Cafe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2> Brew Haven Cafe</h2>

        <nav>
            <a href="#home">Home</a>
            <a href="#menu">Menu</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <section id="home" class="hero">
        <h1>Welcome to Brew Haven Cafe</h1>
        <p>Fresh Coffee, Happy Moments!</p>
        <a href="#menu" class="btn">Explore Menu</a>
    </section>

    <section id="menu" class="menu">
        <h1>Our Menu</h1>
        <p>Enjoy our fresh tea and coffee.</p>

        <div class="items">

            <div class="card">
                <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=600&q=80"
                     alt="Hot Coffee">

                <h3>Hot Coffee</h3>
                <p class="price">₹50</p>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1571934811356-5cc061b6821f?auto=format&fit=crop&w=600&q=80"
                     alt="Hot Tea">

                <h3>Hot Tea</h3>
                <p class="price">₹20</p>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1572442388796-11668a67e53d?auto=format&fit=crop&w=600&q=80"
                     alt="Cappuccino">

                <h3>Cappuccino</h3>
                <p class="price">₹100</p>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1461023058943-07fcbe16d735?auto=format&fit=crop&w=600&q=80"
                     alt="Cafe Latte">

                <h3>Cafe Latte</h3>
                <p class="price">₹110</p>
            </div>

        </div>
    </section>

    <section id="contact" class="contact">
        <h2>Visit Our Cafe</h2>
        <p>Fresh Tea and Coffee, Made with Love!</p>
    </section>

    <footer>
        <p> Brew Haven Cafe</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
